<!DOCTYPE html>
<html lang="zh-CN" class="splash-lock">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="轻记">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#4f74e3">
<title>轻记 · 任务与备忘</title>
<style>
:root{
  --bg:#eef2f8;
  --ink:#1d2836;
  --sub:#7b8698;
  --accent:#4f74e3;
  --accent-deep:#3a5cd0;
  --accent-soft:rgba(79,116,227,.12);
  --pri-high:#4f74e3;
  --pri-mid:#f0a860;
  --pri-low:#a9bcd8;
  --glass:rgba(255,255,255,.52);
  --glass-strong:rgba(255,255,255,.66);
  --glass-border:rgba(255,255,255,.72);
  --shadow:0 10px 24px -14px rgba(70,100,190,.38);
  --danger:#e0607a;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;height:100%;overflow:hidden;scrollbar-width:none}
html.splash-lock{overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  color:var(--ink);font-size:16px;line-height:1.6;
  min-height:100vh;min-height:100dvh;
  height:100%;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-touch-callout:none;
}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
/* 柔光渐层背景，fixed 常驻，body 不设背景色 */
body::before{
  content:"";position:fixed;left:-30%;right:-30%;top:-18%;height:58vh;
  background:
    radial-gradient(46% 42% at 30% 46%, rgba(120,150,240,.32), transparent 70%),
    radial-gradient(50% 44% at 76% 26%, rgba(165,195,250,.36), transparent 70%),
    radial-gradient(42% 38% at 56% 80%, rgba(185,160,245,.24), transparent 70%);
  filter:blur(30px);z-index:-1;pointer-events:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.5);
  backdrop-filter:blur(14px) saturate(1.5);
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow);
  border-radius:var(--radius);
}
/* ---------- 开屏 ---------- */
#splash{position:fixed;left:0;right:0;top:0;height:100lvh;overflow:hidden;z-index:60;background:#eef2f8;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease}
#splash::before{content:"";position:absolute;inset:0;opacity:0;animation:splashFade .35s ease .3s forwards;background:
  radial-gradient(60% 46% at 32% 42%, rgba(120,150,240,.30), transparent 70%),
  radial-gradient(56% 46% at 74% 60%, rgba(165,195,250,.34), transparent 70%)}
#splash.hide{opacity:0;pointer-events:none}
.sp-inner{position:relative;text-align:center;opacity:0;transform:translateY(-9vh);animation:splashFade .35s ease .34s forwards}
.sp-logo{width:64px;height:64px;border-radius:20px;margin:0 auto 16px;background:linear-gradient(135deg,#5b7cf0,#8aa6f8);box-shadow:0 14px 30px -12px rgba(79,116,227,.6)}
.sp-inner p{font-size:22px;font-weight:700;letter-spacing:.12em}
.sp-inner span{display:block;font-size:13px;color:var(--sub);margin-top:6px;letter-spacing:.28em}
@keyframes splashFade{to{opacity:1}}
/* ---------- 顶栏 ---------- */
.page{padding:calc(env(safe-area-inset-top) + 20px) 18px 0;max-width:560px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 0}
.greet{font-size:22px;font-weight:700;letter-spacing:.02em}
.date{font-size:13px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5b7cf0,#8aa6f8);flex:none;box-shadow:0 8px 18px -8px rgba(79,116,227,.55)}
/* ---------- 进度条区域 ---------- */
.strip{display:flex;align-items:center;gap:12px;margin:16px 0 12px;padding:12px 14px}
.prog{flex:1;min-width:0}
.prog .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.prog .lab b{color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:999px;background:rgba(79,116,227,.16);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b7cf0,#7ea0f8);border-radius:999px;transition:width .5s ease}
.chip{padding:6px 12px;border-radius:999px;font-size:12px;white-space:nowrap;background:var(--accent-soft);color:var(--accent-deep);font-variant-numeric:tabular-nums;flex:none}
/* ---------- 分段切换 ---------- */
.seg{display:flex;margin:0 0 14px;padding:3px;border-radius:12px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.seg button{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums;min-height:44px}
.seg button.on{background:rgba(255,255,255,.92);color:var(--ink);font-weight:600;box-shadow:0 2px 8px rgba(60,90,180,.18)}
/* ---------- 任务卡片 ---------- */
.list{display:flex;flex-direction:column;gap:10px;min-height:60px}
.task-card{
  display:flex;align-items:center;gap:11px;padding:13px 14px;
  user-select:none;-webkit-user-select:none;touch-action:pan-y;
  transition:transform .18s ease,opacity .25s ease;
}
.task-card.dragging{opacity:.94;transform:scale(1.03);box-shadow:0 18px 36px -12px rgba(60,90,180,.45);z-index:5;transition:none}
.task-card.leaving{opacity:0;transform:translateX(14px) scale(.97)}
.check{width:24px;height:24px;border-radius:50%;border:1.6px solid #93a2c0;flex:none;display:flex;align-items:center;justify-content:center;padding:0;min-height:44px;min-width:44px;position:relative}
.check::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-2px);opacity:0}
.check.on{border-color:var(--accent);background:var(--accent)}
.check.on::after{opacity:1}
.check .ring{position:absolute;inset:10px;border-radius:50%}
.t-body{flex:1;min-width:0}
.t-title{font-size:15.5px;font-weight:600;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-card.done .t-title{color:var(--sub);text-decoration:line-through}
.t-meta{font-size:12px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.empty{padding:26px 16px;text-align:center;color:var(--sub);font-size:14px}
/* ---------- 底部导航 ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;justify-content:space-around;align-items:stretch;
  padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);
  background:rgba(255,255,255,.58);
  -webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);
  border-top:1px solid rgba(255,255,255,.65);
}
#tabbar button{flex:1;font-size:12.5px;color:var(--sub);letter-spacing:.05em;padding:8px 0;min-height:44px}
#tabbar button.on{color:var(--accent-deep);font-weight:700}
#fab{
  position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:20;
  width:54px;height:54px;border-radius:50%;font-size:24px;line-height:1;color:#fff;
  background:linear-gradient(135deg,#5b7cf0,#7ea0f8);
  border:1px solid rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 12px 26px -10px rgba(79,116,227,.68);
  transition:transform .18s ease,opacity .18s ease;
}
#fab.hide{opacity:0;transform:scale(.6);pointer-events:none}
/* ---------- 统计 ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px;padding:0 4px}
.cal-head b{font-size:16px;font-variant-numeric:tabular-nums}
.cal-nav{width:38px;height:38px;border-radius:12px;font-size:18px;color:var(--sub);background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.62);min-height:38px}
.cal{padding:12px}
.cal-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-row span.wk{font-size:11.5px;color:var(--sub);text-align:center;padding:4px 0}
.cal-cell{position:relative;aspect-ratio:1/.92;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:13.5px;font-variant-numeric:tabular-nums;min-height:38px}
.cal-cell .num{line-height:1.2}
.cal-cell .cnt{font-size:9.5px;color:var(--accent-deep);line-height:1.2}
.cal-cell.today{box-shadow:inset 0 0 0 1.6px rgba(79,116,227,.5)}
.cal-cell.sel{background:var(--accent);color:#fff}
.cal-cell.sel .cnt{color:#fff}
.cal-cell.dim{opacity:.4}
.weekbars{display:flex;gap:8px;align-items:flex-end;margin-top:12px;padding:12px 14px 8px}
.weekbars .col{flex:1;display:flex;flex-direction:column;gap:5px;align-items:center}
.weekbars .col i{display:block;width:100%;max-width:18px;border-radius:5px;background:var(--accent);opacity:.18;height:6px}
.weekbars .col.on i{opacity:1}
.weekbars .col span{font-size:10px;color:var(--sub)}
.weekbars .col b{font-size:10px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.sumrow{display:flex;gap:10px;margin-top:12px}
.sum{flex:1;padding:12px;text-align:center}
.sum b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--sub)}
.sec-title{font-size:13px;letter-spacing:.14em;color:var(--sub);margin:20px 4px 10px;font-weight:600}
/* ---------- 我的 ---------- */
.me-card{padding:16px;margin-bottom:14px}
.me-card h3{font-size:15px;font-weight:700;margin-bottom:8px}
.me-card p{font-size:13.5px;color:var(--sub)}
.me-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:10px}
.me-row + .me-row{border-top:1px solid rgba(120,140,190,.12)}
.me-row .lab{font-size:15px;font-weight:600}
.me-row .val{font-size:12.5px;color:var(--sub)}
.btn{
  display:block;width:100%;text-align:center;padding:13px;border-radius:13px;font-size:15px;font-weight:600;
  background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.66);color:var(--ink);min-height:44px;
  box-shadow:0 8px 18px -12px rgba(70,100,190,.35);
}
.btn.primary{background:linear-gradient(135deg,#5b7cf0,#7ea0f8);color:#fff;border:none;box-shadow:0 10px 24px -10px rgba(79,116,227,.6)}
.btn.danger{color:var(--danger)}
.btn + .btn{margin-top:10px}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:rgba(120,140,190,.3);transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
/* ---------- 弹层 ---------- */
#mask{position:fixed;inset:0;z-index:30;background:rgba(20,30,60,.35);opacity:0;pointer-events:none;transition:opacity .25s}
#mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;
  transform:translateY(103%);
  transition:transform .3s ease;
  background:rgba(250,252,255,.88);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
  border-radius:22px 22px 0 0;
  padding:18px 20px calc(env(safe-area-inset-bottom) + 18px);
  max-height:86vh;max-height:86dvh;overflow-y:auto;
}
.sheet.show{transform:translateY(0);box-shadow:0 -28px 60px rgba(30,50,100,.28)}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field input[type=text],.field input[type=password],.field textarea{
  width:100%;padding:11px 13px;border-radius:12px;border:1px solid rgba(120,140,190,.25);
  background:rgba(255,255,255,.7);font-size:16px;outline:none;
}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.miniseg{display:flex;gap:8px}
.miniseg button{flex:1;padding:10px 0;border-radius:11px;font-size:14px;background:rgba(255,255,255,.6);border:1px solid rgba(120,140,190,.2);color:var(--sub);min-height:44px}
.miniseg button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.wkrow{display:flex;gap:8px}
.wkrow button{flex:1;padding:10px 0;border-radius:11px;font-size:14px;background:rgba(255,255,255,.6);border:1px solid rgba(120,140,190,.2);color:var(--sub);min-height:44px}
.wkrow button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.sheetbtns{display:flex;gap:10px;margin-top:4px}
.sheetbtns .btn{margin-top:0}
/* ---------- 提示 ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:40;
  transform:translateX(-50%) translateY(8px);opacity:0;pointer-events:none;
  padding:11px 18px;border-radius:14px;font-size:14px;color:#fff;max-width:82vw;text-align:center;
  background:rgba(30,40,70,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:opacity .25s,transform .25s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- 锁屏 ---------- */
#lock{position:fixed;left:0;right:0;top:0;height:100lvh;overflow:hidden;z-index:55;background:#eef2f8;display:flex;align-items:center;justify-content:center}
#lock::before{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 46% at 32% 42%, rgba(120,150,240,.28), transparent 70%),
  radial-gradient(56% 46% at 74% 60%, rgba(165,195,250,.32), transparent 70%)}
#lock .lk{position:relative;text-align:center;width:min(320px,84vw)}
#lock .lk .sp-logo{margin-bottom:20px}
#lock input{width:100%;text-align:center;padding:12px;border-radius:12px;border:1px solid rgba(120,140,190,.3);background:rgba(255,255,255,.7);font-size:16px;outline:none;margin-bottom:12px}
#lock input:focus{border-color:var(--accent)}
#lock .err{color:var(--danger);font-size:13px;min-height:20px;margin-bottom:8px}
#lock[hidden]{display:none}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<div id="splash"><div class="sp-inner"><div class="sp-logo"></div><p>轻记</p><span>任务与备忘</span></div></div>

<div id="lock" hidden>
  <div class="lk">
    <div class="sp-logo"></div>
    <p style="font-size:18px;font-weight:700;margin-bottom:6px">轻记已锁定</p>
    <p style="font-size:13px;color:var(--sub);margin-bottom:20px">输入密码解锁本地数据</p>
    <input type="password" id="lockPass" placeholder="密码" autocomplete="off">
    <p class="err" id="lockErr"></p>
    <button class="btn primary" id="lockBtn">解锁</button>
  </div>
</div>

<main id="view" class="page"></main>

<button id="fab" aria-label="新增">＋</button>

<nav id="tabbar">
  <button data-tab="tasks" class="on">任务</button>
  <button data-tab="memos">备忘</button>
  <button data-tab="stats">统计</button>
  <button data-tab="me">我的</button>
</nav>

<div id="mask" hidden></div>

<div class="sheet" id="sheetTask" hidden>
  <h3 id="taskSheetTitle">新建任务</h3>
  <div class="field">
    <label for="tTitle">标题</label>
    <input type="text" id="tTitle" maxlength="60" placeholder="想完成什么">
  </div>
  <div class="field">
    <label>重复</label>
    <div class="miniseg" id="tRec">
      <button data-v="once">仅一次</button>
      <button data-v="daily">每天</button>
      <button data-v="weekly">每周</button>
    </div>
  </div>
  <div class="field" id="tWkField" hidden>
    <label>选择周几</label>
    <div class="wkrow" id="tWk">
      <button data-v="1">一</button><button data-v="2">二</button><button data-v="3">三</button>
      <button data-v="4">四</button><button data-v="5">五</button><button data-v="6">六</button><button data-v="7">日</button>
    </div>
  </div>
  <div class="sheetbtns">
    <button class="btn" id="tDelete" hidden>删除</button>
    <button class="btn primary" id="tSave" style="flex:1">保存</button>
  </div>
</div>

<div class="sheet" id="sheetMemo" hidden>
  <h3 id="memoSheetTitle">记一条备忘</h3>
  <div class="field">
    <textarea id="mText" maxlength="500" placeholder="随手记点什么"></textarea>
  </div>
  <div class="sheetbtns">
    <button class="btn primary" id="mSave" style="flex:1">保存</button>
  </div>
</div>

<div class="sheet" id="sheetConfirm" hidden>
  <h3 id="cTitle">确认</h3>
  <p id="cDesc" style="font-size:14px;color:var(--sub);margin-bottom:18px"></p>
  <div class="sheetbtns">
    <button class="btn" id="cCancel" style="flex:1">取消</button>
    <button class="btn danger" id="cOk" style="flex:1">确定</button>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="importFile" accept=".json" hidden>

<script>
'use strict';
/* ================= 应用标识 ================= */
const APP = { id:'local-task-memo', name:'轻记', version:'1.1', schemaVersion:1 };
const STORES = ['tasks','memos','meta'];

/* ================= 数据层 ================= */
const DB = (() => {
  const DB_NAME = 'qingji-local-db', DB_VERSION = 1;
  let mode = 'idb', db = null;
  const isMeta = s => s === 'meta';
  const keyOf = s => isMeta(s) ? 'key' : 'id';
  const lsKey = s => 'qingji-' + s;

  function open(){
    return new Promise((res, rej) => {
      const rq = indexedDB.open(DB_NAME, DB_VERSION);
      rq.onupgradeneeded = e => {
        const d = e.target.result;
        for (const s of STORES){
          if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: keyOf(s) });
        }
      };
      rq.onsuccess = e => res(e.target.result);
      rq.onerror = () => rej(rq.error);
    });
  }

  function lsRead(s){ try{ return JSON.parse(localStorage.getItem(lsKey(s)) || '[]'); }catch(e){ return []; } }
  function lsWrite(s, arr){ localStorage.setItem(lsKey(s), JSON.stringify(arr)); }

  return {
    get mode(){ return mode; },
    async init(){
      try { db = await open(); mode = 'idb'; }
      catch(e){ mode = 'local'; }
    },
    getAll(s){
      if (mode === 'idb'){
        return new Promise((res, rej) => {
          const rq = db.transaction(s,'readonly').objectStore(s).getAll();
          rq.onsuccess = () => res(rq.result || []);
          rq.onerror = () => rej(rq.error);
        });
      }
      return Promise.resolve(lsRead(s));
    },
    put(s, rec){
      rec.schemaVersion = APP.schemaVersion;
      if (mode === 'idb'){
        return new Promise((res, rej) => {
          const t = db.transaction(s,'readwrite');
          t.objectStore(s).put(rec);
          t.oncomplete = () => res(rec);
          t.onerror = () => rej(t.error);
        });
      }
      const arr = lsRead(s); const k = keyOf(s);
      const i = arr.findIndex(x => x[k] === rec[k]);
      if (i >= 0) arr[i] = rec; else arr.push(rec);
      lsWrite(s, arr);
      return Promise.resolve(rec);
    },
    del(s, key){
      if (mode === 'idb'){
        return new Promise((res, rej) => {
          const t = db.transaction(s,'readwrite');
          t.objectStore(s).delete(key);
          t.oncomplete = () => res();
          t.onerror = () => rej(t.error);
        });
      }
      const k = keyOf(s);
      lsWrite(s, lsRead(s).filter(x => x[k] !== key));
      return Promise.resolve();
    },
    putMany(s, recs){ return Promise.all(recs.map(r => this.put(s, r))); }
  };
})();

/* ================= 模式迁移 ================= */
/* 每个版本一个纯函数，输入 {tasks:[],memos:[],meta:[]}，输出升级后同结构数据；必须幂等 */
const MIGRATIONS = [
  function migrate_0_to_1(data){ return data; }
];

function detectVersion(data){
  const metaRec = (data.meta || []).find(r => r.key === 'meta');
  if (metaRec && typeof metaRec.schemaVersion === 'number') return metaRec.schemaVersion;
  const all = [...(data.tasks||[]), ...(data.memos||[])];
  const vs = all.map(r => r.schemaVersion).filter(v => typeof v === 'number');
  return vs.length ? Math.min(...vs) : 0;
}

function runMigrations(data, fromV){
  let v = fromV, out = data;
  while (v < APP.schemaVersion){
    const fn = MIGRATIONS[v];
    if (typeof fn !== 'function') break;
    out = fn(out);
    v++;
  }
  const metaArr = (out.meta || []).filter(r => r.key !== 'meta');
  metaArr.push({ key:'meta', schemaVersion: APP.schemaVersion });
  out.meta = metaArr;
  return out;
}

/* ================= 工具 ================= */
const pad = n => String(n).padStart(2,'0');
function dstr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function weekdayCN(d){ return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]; }
function isoWeekday(d){ return (d.getDay() + 6) % 7 + 1; } /* 周一=1 … 周日=7 */
function nowTs(){ return Date.now(); }
function genId(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + nowTs() + '-' + Math.random().toString(36).slice(2,9)); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function reducedMotion(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

async function sha256(str){
  if (crypto && crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('qingji::' + str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  let h1 = 5381, h2 = 52711;
  for (let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 = ((h1 << 5) + h1 + c) | 0;
    h2 = ((h2 << 7) + h2 ^ c) | 0;
  }
  return 'x' + ((h1 >>> 0).toString(16) + (h2 >>> 0).toString(16));
}

function scheduledOn(task, ds){
  if (task.recurrence === 'daily') return true;
  if (task.recurrence === 'weekly') return task.weekDay === isoWeekday(new Date(ds + 'T00:00:00'));
  return false;
}
function activeTasks(){ return state.tasks.filter(t => !t.deleted); }
function pendingToday(){
  const today = dstr(new Date());
  return activeTasks().filter(t => {
    if (t.completedDates.includes(today)) return false;
    return t.recurrence === 'once' || scheduledOn(t, today);
  }).sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0));
}
function doneToday(){
  const today = dstr(new Date());
  return activeTasks().filter(t => t.completedDates.includes(today));
}
function completionsOn(ds){
  return activeTasks().filter(t => t.completedDates.includes(ds));
}
function calcStreak(){
  const set = new Set();
  state.tasks.forEach(t => (t.completedDates||[]).forEach(d => set.add(d)));
  let n = 0; const d = new Date();
  if (!set.has(dstr(d))) d.setDate(d.getDate()-1);
  while (set.has(dstr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function last7Counts(){
  const arr = [];
  for (let i = 6; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    arr.push({ ds: dstr(d), label: '日一二三四五六'[d.getDay()], count: completionsOn(dstr(d)).length, isToday: i===0 });
  }
  return arr;
}
function weekRange(offset){
  const now = new Date();
  const mon = new Date(now); mon.setDate(now.getDate() - (isoWeekday(now) - 1) + offset*7);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return { start: dstr(mon), end: dstr(sun) };
}
function countInRange(range){
  let c = 0;
  state.tasks.forEach(t => (t.completedDates||[]).forEach(d => { if (d >= range.start && d <= range.end) c++; }));
  return c;
}
function monthStats(y, m){
  const today = new Date(); const tstr = dstr(today);
  let expected = 0, completed = 0;
  const days = new Date(y, m+1, 0).getDate();
  for (let dd = 1; dd <= days; dd++){
    const ds = dstr(new Date(y, m, dd));
    if (ds > tstr) break;
    for (const t of activeTasks()){
      const created = dstr(new Date(t.createdAt));
      if (ds < created) continue;
      const done = (t.completedDates||[]).includes(ds);
      if (t.recurrence === 'once'){
        if (ds === created){ expected++; if (done) completed++; }
      } else if (scheduledOn(t, ds)){
        expected++; if (done) completed++;
      }
    }
  }
  return { expected, completed, rate: expected ? Math.round(completed/expected*100) : null };
}

async function toggleComplete(id, cardEl){
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const today = dstr(new Date());

  else t.completedDates.splice(i,1);

/* 长按拖动排序 */
function setupDrag(){
  const list = document.getElementById('taskList');
  if (!list) return;
  list.addEventListener('pointerdown', onDown);
}
let drag = null, pressTimer = null, downPos = null, longFired = false;
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive:false });

function onDown(e){
  if (state.tab !== 'tasks') return;
  const card = e.target.closest('.task-card');
  if (!card || e.target.closest('.check')) return;
  downPos = { x:e.clientX, y:e.clientY, card, target:e.target };
  longFired = false;
  pressTimer = setTimeout(() => { longFired = true; startDrag(card, e); }, 350);
}
function startDrag(card, e){
  const list = card.parentElement;
  const items = [...list.querySelectorAll('.task-card')];
  const rects = items.map(el => el.getBoundingClientRect());
  drag = { card, items, rects, startY: e.clientY, idx: items.indexOf(card) };
  card.classList.add('dragging');
  if (reducedMotion()) items.forEach(el => { if (el !== card) el.style.transition = 'none'; });
}
window.addEventListener('pointermove', e => {
  if (!drag){
    if (pressTimer && downPos && Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y) > 8){
      clearTimeout(pressTimer); pressTimer = null;
    }
    return;
  }
  const dy = e.clientY - drag.startY;
  drag.card.style.transform = `translate(0,${dy}px) scale(1.03)`;
  const from = drag.items.indexOf(drag.card);
  const step = drag.rects[from].height + 10;
  const centerY = drag.rects[from].top + drag.rects[from].height/2 + dy;
  let idx = from;
  drag.items.forEach((el, i) => {
    if (i === from) return;
    const mid = drag.rects[i].top + drag.rects[i].height/2;
    if (i > from && centerY > mid) idx = Math.max(idx, i);
    if (i < from && centerY < mid) idx = Math.min(idx, i);
  });
  drag.items.forEach((el, i) => {
    if (el === drag.card) return;
    let shift = 0;
    if (i > from && i <= idx) shift = -step;
    else if (i < from && i >= idx) shift = step;
    el.style.transform = shift ? `translateY(${shift}px)` : '';
  });
  drag.idx = idx;
});
window.addEventListener('pointerup', e => {
  if (drag){
    const { card, items, idx } = drag;
    const from = items.indexOf(card);
    card.classList.remove('dragging');
    card.style.transform = '';
    items.forEach(el => el.style.transform = '');
    if (idx != null && idx !== from) commitReorder(items.map(x => x.dataset.id), card.dataset.id, idx);
    drag = null; pressTimer = null;
    return;
  }
  if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
  if (downPos && !longFired && Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y) < 8){
    const card = downPos.card;
    if (!e.target.closest('.check')) openTaskSheet(card.dataset.id);
  }
  downPos = null;
});
async function commitReorder(ids, id, toIdx){
  const arr = ids.filter(x => x !== id);
  arr.splice(toIdx, 0, id);
  const changed = [];
  arr.forEach((tid, i) => {
    const t = state.tasks.find(x => x.id === tid);
    if (t && t.sortOrder !== i + 1){ t.sortOrder = i + 1; t.updatedAt = nowTs(); changed.push(t); }
  });
  if (changed.length) await DB.putMany('tasks', changed);
  render();
}

  document.getElementById('memoSheetTitle').textContent = '记一条备忘';
  document.getElementById('mText').value = '';
  showSheet('sheetMemo');
  setTimeout(() => document.getElementById('mText').focus(), 320);
}
async function saveMemo(){
  const text = document.getElementById('mText').value.trim();
  if (!text){ toast('写点什么再保存'); return; }
  await DB.put('memos', { id: genId(), text, createdAt: nowTs(), updatedAt: nowTs(), deleted:false });
  state.memos = await DB.getAll('memos');
  hideSheets(); render();
}
async function destroyMemo(cardEl){
  const id = cardEl.dataset.id;
  const m = state.memos.find(x => x.id === id);
  if (!m) return;
  if (reducedMotion()){
    await DB.del('memos', id);
    state.memos = await DB.getAll('memos');
    render(); toast('已销毁'); return;
  }
  cardEl.style.transition = 'transform .25s ease, opacity .25s ease';
  cardEl.style.transform = 'scale(.9)';
  cardEl.style.opacity = '0';
  setTimeout(async () => {
    await DB.del('memos', id);
    state.memos = await DB.getAll('memos');
    render(); toast('已销毁');
  }, 240);
}

/* ================= 导入导出 ================= */
async function exportData(){
  const payload = {
    app: APP.id, name: APP.name, schemaVersion: APP.schemaVersion,
    exportedAt: new Date().toISOString(),
    data: { tasks: await DB.getAll('tasks'), memos: await DB.getAll('memos'), meta: await DB.getAll('meta') }
  };
  const json = JSON.stringify(payload, null, 2);
  const fname = `轻记备份-${dstr(new Date())}.json`;
  if (window.showSaveFilePicker){
    try {
      const h = await window.showSaveFilePicker({ suggestedName: fname, types:[{ description:'JSON 备份', accept:{'application/json':['.json']} }] });
      const w = await h.createWritable();
      await w.write(new Blob([json], { type:'application/json' }));
      await w.close();
      toast('已保存到你选择的位置');
      return;
    } catch(e){ if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(new Blob([json], { type:'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = fname; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast(`已导出「${fname}」，保存在浏览器默认下载文件夹`);
}

document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    let parsed;
    try { parsed = JSON.parse(await file.text()); }
    catch(err){ toast('导入失败：文件无法解析'); return; }
    if (!parsed || parsed.app !== APP.id){ toast('导入失败：这不是本应用的备份文件'); return; }
    if (typeof parsed.schemaVersion !== 'number'){ toast('导入失败：备份缺少版本信息'); return; }
    if (parsed.schemaVersion > APP.schemaVersion){ toast('导入失败：备份版本较新，请先更新应用'); return; }
    const incoming = runMigrations(parsed.data || {}, parsed.schemaVersion);

    /* 合并：按主键， updatedAt 新者为准；完全冲突且无法判断时以导入为准 */
    for (const s of ['tasks','memos']){
      const map = new Map(state[s].map(r => [r.id, r]));
      for (const r of (incoming[s] || [])){
        const old = map.get(r.id);
        if (!old) map.set(r.id, r);
        else if ((r.updatedAt||0) >= (old.updatedAt||0)) map.set(r.id, r);
      }
      await DB.putMany(s, [...map.values()]);
    }
    /* 设置：仅当前没有设置记录时采用导入值 */
    const incSettings = (incoming.meta || []).find(r => r.key === 'settings');
    if (incSettings && !state.settings.updatedAt) await DB.put('meta', incSettings);

    toast('导入完成，正在刷新');
    setTimeout(() => location.reload(), 800);
  } catch(err){
    toast('导入失败：文件内容不完整');
  }
});

async function confirmClearAll(){
  confirmSheet('清除全部数据', '将删除本应用保存在这台设备上的全部任务、备忘和设置，且无法恢复。确定继续吗？', '全部清除', async () => {
    confirmSheet('再次确认', '这是最后一次确认：清除后数据无法找回。', '确认清除', async () => {
      for (const s of STORES){
        const recs = await DB.getAll(s);
        for (const r of recs) await DB.del(s, r[s === 'meta' ? 'key' : 'id']);
      }
      toast('已清除，正在刷新');
      setTimeout(() => location.reload(), 800);
    });
  });
}

/* ================= 密码锁 ================= */
function onLockSwitch(){
  if (state.settings.lockEnabled){
    promptPassword('输入当前密码以关闭解锁', async (pass, done) => {
      const h = await sha256(pass);
      if (h === state.settings.passHash) return true;
      done('密码不正确'); return false;
    }, async () => {
      state.settings.lockEnabled = false; state.settings.passHash = '';
      state.settings.updatedAt = nowTs();
      await DB.put('meta', state.settings);
      toast('已关闭密码解锁');
    });
  } else {
    promptPassword('设置解锁密码', async (pass, done) => {
      if (pass.length < 4){ done('密码至少 4 位'); return false; }
      window._newPass = pass; return true;
    }, async () => {
      state.settings.passHash = await sha256(window._newPass || '');
      state.settings.lockEnabled = true;
      state.settings.updatedAt = nowTs();
      delete window._newPass;
      await DB.put('meta', state.settings);
      toast('密码解锁已开启');
    });
  }
  render();
}
function promptPassword(title, validator, onOk){
  const wrap = el(`<div class="sheet" id="sheetPass">
    <h3>${esc(title)}</h3>
    <div class="field"><input type="password" id="passInput" placeholder="密码" autocomplete="off"></div>
    <p class="err" id="passErr" style="color:var(--danger);font-size:13px;min-height:20px;margin-bottom:8px"></p>
    <div class="sheetbtns">
      <button class="btn" id="passCancel" style="flex:1">取消</button>
      <button class="btn primary" id="passOk" style="flex:1">确定</button>
    </div>
  </div>`);
  document.body.appendChild(wrap);
  showSheet('sheetPass');
  setTimeout(() => wrap.querySelector('#passInput').focus(), 320);
  const close = () => { wrap.remove(); hideSheets(); };
  wrap.querySelector('#passCancel').addEventListener('click', () => { close(); render(); });
  wrap.querySelector('#passOk').addEventListener('click', async () => {
    const pass = wrap.querySelector('#passInput').value;
    const errEl = wrap.querySelector('#passErr');
    const ok = await validator(pass, msg => { errEl.textContent = msg; });
    if (ok){ close(); await onOk(); render(); }
  });
}
function showLock(){
  const lk = document.getElementById('lock');
  lk.hidden = false;
  const input = document.getElementById('lockPass');
  const err = document.getElementById('lockErr');
  const tryUnlock = async () => {
    const h = await sha256(input.value);
    if (h === state.settings.passHash){ lk.hidden = true; input.value = ''; err.textContent = ''; }
    else { err.textContent = '密码不正确'; input.select(); }
  };
  document.getElementById('lockBtn').onclick = tryUnlock;
  input.onkeydown = e => { if (e.key === 'Enter') tryUnlock(); };
  setTimeout(() => input.focus(), 200);
}

/* ================= 事件绑定 ================= */
document.getElementById('tabbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (state.tab === b.dataset.tab) return;
  state.tab = b.dataset.tab;
  render();
  document.body.scrollTo({ top:0 });
});
segBind('tRec', v => {

document.getElementById('tWk').addEventListener('click', e => {

document.getElementById('tDelete').addEventListener('click', deleteTaskFlow);

document.getElementById('cCancel').addEventListener('click', () => { state.confirmAction = null; hideSheets(); });
document.getElementById('cOk').addEventListener('click', async () => {

});

});

    if (v === 'today' || v === 'done'){ state.taskView = v; render(); }
  }
  const check = e.target.closest('.check');
  if (check){
    const card = check.closest('.task-card');
    toggleComplete(check.dataset.id, card);
  }
});

/* ================= 启动 ================= */
(async function boot(){
  await DB.init();
  let data = { tasks:[], memos:[], meta:[] };
  for (const s of STORES) data[s] = await DB.getAll(s);
  data = runMigrations(data, detectVersion(data));
  state.tasks = data.tasks || [];
  state.memos = data.memos || [];
  const metaRec = (data.meta || []).find(r => r.key === 'meta');
  if (metaRec) state.metaRec = metaRec;
  const sRec = (data.meta || []).find(r => r.key === 'settings');
  if (sRec) state.settings = sRec;

  /* 申请持久化存储，结果记录到 meta */
  if (navigator.storage && navigator.storage.persist){
    try {
      const granted = await navigator.storage.persist();
      state.metaRec.persisted = !!granted;
      await DB.put('meta', state.metaRec);
    } catch(e){}
  }

  if (state.settings.lockEnabled) showLock();
  render();

  /* 开屏：纯色遮蔽 + 延迟淡入，约 1.6s 收起 */
  setTimeout(() => {
    const sp = document.getElementById('splash');
    document.documentElement.classList.remove('splash-lock');
    sp.classList.add('hide');
    setTimeout(() => sp.remove(), 500);
  }, 1600);
})();
</script>
<script>
/* PWA：仅 https 环境注册；新版本激活后自动刷新一次 */
if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'activated' && navigator.serviceWorker.controller) location.reload();
      });
    });
  }).catch(() => {});
}
</script>
